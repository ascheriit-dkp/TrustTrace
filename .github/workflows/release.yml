name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: sudo apt-get update && sudo apt-get install -y clang
      - name: Verify and build
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          make generate check integration
          make release VERSION="$RELEASE_VERSION"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            dist/trusttrace-linux-amd64 dist/trusttrace-linux-arm64 \
            dist/SHA256SUMS dist/LICENSE dist/THIRD_PARTY_NOTICES.md \
            --draft --verify-tag --title "trusttrace $RELEASE_VERSION" \
            --notes-file docs/RELEASE_NOTES.md
