name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Install BPF compiler
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Rebuild both BPF objects
        run: make generate
      - name: Formatting, static analysis and unit tests
        run: make check
      - name: Race detector
        run: go test -race ./...
      - name: Kernel integration tests
        run: |
          if ! test -r /sys/kernel/btf/vmlinux; then
            echo '::warning::Kernel integration unavailable: runner exposes no kernel BTF.'
            exit 0
          fi
          make integration
      - name: Cross-build releases
        run: make release VERSION=ci
  windows-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go test ./...
      - run: go vet ./...
